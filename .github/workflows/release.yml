name: Release Sandrix Studio APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.1'
        required: true
      no_minify:
        description: 'Build without R8 (use if the minified app misbehaves)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify bundled engine files
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libaapt2.so || { echo "Missing app/src/main/jniLibs/arm64-v8a/libaapt2.so (see ENGINE.md)"; exit 1; }
          test -s app/src/main/assets/sandrix_engine/platforms/android-36/android.jar || { echo "Missing android-36/android.jar in assets (see ENGINE.md)"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SANDRIX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing secret SANDRIX_KEYSTORE_BASE64 (see RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SANDRIX_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SANDRIX_STORE_PASSWORD: ${{ secrets.SANDRIX_STORE_PASSWORD }}
          SANDRIX_KEY_ALIAS: ${{ secrets.SANDRIX_KEY_ALIAS }}
          SANDRIX_KEY_PASSWORD: ${{ secrets.SANDRIX_KEY_PASSWORD }}
        run: |
          EXTRA=""
          if [ "${{ inputs.no_minify }}" = "true" ]; then EXTRA="-PnoMinify"; fi
          gradle --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}" $EXTRA

      - name: Prepare release files
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "Sandrix-Studio-${{ steps.ver.outputs.name }}.apk"
          sha256sum "Sandrix-Studio-${{ steps.ver.outputs.name }}.apk" > SHA256SUMS.txt
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping.txt
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="Sandrix-Studio-${{ steps.ver.outputs.name }}.apk SHA256SUMS.txt"
          if [ -f mapping.txt ]; then FILES="$FILES mapping.txt"; fi
          gh release create "v${{ steps.ver.outputs.name }}" $FILES \
            --target "$GITHUB_SHA" \
            --title "Sandrix Studio ${{ steps.ver.outputs.name }}" \
            --generate-notes
